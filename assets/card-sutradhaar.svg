  <text x="219" y="153" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, Consolas, monospace" font-size="11">MSDF Typography</text>

  <text x="22" y="188" fill="#7c8cff" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700">sutradhaar-studio.pages.dev  →</text>
