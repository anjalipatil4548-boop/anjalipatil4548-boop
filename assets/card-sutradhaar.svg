      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="c1acc" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="430" height="210" rx="16" fill="url(#c1bg)" stroke="#2e354d" stroke-width="1.3"/>
  <rect x="0" y="0" width="430" height="4" rx="2" fill="url(#c1acc)"/>

  <!-- Live pill -->
  <rect x="22" y="20" width="128" height="24" rx="12" fill="#1e2238" stroke="#4c568a"/>
  <circle cx="36" cy="32" r="4" fill="#22c55e">
