<svg width="430" height="210" viewBox="0 0 430 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1bg" x1="0" y1="0" x2="430" y2="210" gradientUnits="userSpaceOnUse">
