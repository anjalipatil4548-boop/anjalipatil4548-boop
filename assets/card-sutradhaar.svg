  <text x="22" y="76" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="700">1. Sutradhaar Studio</text>
  <text x="22" y="102" fill="#9ca3af" font-family="Segoe UI, Inter, sans-serif" font-size="13">Creative digital &amp; WebGL development studio with</text>
  <text x="22" y="120" fill="#9ca3af" font-family="Segoe UI, Inter, sans-serif" font-size="13">MSDF typography, custom shaders, and showreel.</text>

